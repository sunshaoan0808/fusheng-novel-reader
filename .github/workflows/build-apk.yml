name: Android APK

# 本机没有 JDK / Android SDK，打包放在 GitHub 上跑。
# 触发：push 到 master/main，或手动 Run workflow。
# 产物：Actions 页面底部 Artifacts → apk（含 novel-reader-v*.apk）。

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (34)
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SM" "platforms;android-34" > /dev/null
          fi
          if [ ! -d "$SDK/build-tools/34.0.0" ]; then
            yes | "$SM" "build-tools;34.0.0" > /dev/null
          fi
          ls "$SDK/build-tools" "$SDK/platforms"
          echo "SDK_DIR=$SDK" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "使用仓库 Secrets 里的发布签名"
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_STOREPASS=${{ secrets.ANDROID_STOREPASS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEYPASS=${{ secrets.ANDROID_KEYPASS }}" >> "$GITHUB_ENV"
          else
            PASS="ci-$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias ci \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=CI Temporary, O=novel-reader, C=CN" > /dev/null
            echo "RELEASE_KEY_ALIAS=ci" >> "$GITHUB_ENV"
            echo "RELEASE_STOREPASS=$PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEYPASS=$PASS" >> "$GITHUB_ENV"
            echo "::warning title=临时签名::未配置 ANDROID_KEYSTORE_BASE64，本次用 CI 生成的临时签名，只适合本地测试安装，不能覆盖正式包。"
          fi
          echo "RELEASE_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Assemble work dir
        run: |
          set -e
          APP="$GITHUB_WORKSPACE/build/app"
          rm -rf "$APP"
          mkdir -p "$APP/assets"
          cp -r android/res android/src "$APP/"
          cp android/AndroidManifest.xml "$APP/"
          cp -r www "$APP/assets/www"
          echo "APP=$APP" >> "$GITHUB_ENV"
          du -sh "$APP"

      - name: Build APK
        env:
          VCODE: ${{ github.run_number }}
          VNAME: "1.8.${{ github.run_number }}"
        run: |
          set -e
          SDK="$SDK_DIR" APP="$APP" bash android/build.sh
          ls -la "$APP"/*.apk
          echo "APK_PATH=$APP/novel-reader-v${VCODE}.apk" >> "$GITHUB_ENV"

      - name: Verify APK
        run: |
          set -e
          "$SDK_DIR/build-tools/34.0.0/apksigner" verify --verbose "$APK_PATH" | head -8
          "$SDK_DIR/build-tools/34.0.0/aapt2" dump badging "$APK_PATH" | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/*.apk
          retention-days: 14
          if-no-files-found: error
